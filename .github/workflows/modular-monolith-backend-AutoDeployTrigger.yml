# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/modular-monolith-backend-AutoDeployTrigger.yml'
    branches:
      - Modular-Monolith  
env:
  AZURE_WEBAPP_NAME: 'CareerToolkitMonolithBackend'
  AZURE_WEBAPP_PACKAGE_PATH: "./publish"
  
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore ./backend/Backend.sln
        
      - name: Build
        run: dotnet build ./backend/Backend.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./backend/Backend.sln --configuration Release --no-build -o '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}'
        #run: dotnet publish ./backend/Backend.sln --configuration Release --no-build -o "${{env.DOTNET_ROOT}}/myapp"
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A7666EF6C1C94046872AA5FAD3F46095 }}
